name: ThubanStudy
options:
  bundleIdPrefix: com.thuban
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ThubanCore:
    path: Packages/ThubanCore
  # The Thuban Graph engine bridge; reaches ThubanGraphKit through the gitignored Vendor/ThubanGraph symlink that
  # scripts/link-graph.sh creates (every script runs it first).
  StudyGraph:
    path: Packages/StudyGraph
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    THUBAN_GRAPH_KIT_REVISION: ""
    CURRENT_PROJECT_VERSION: "1"
targets:
  ThubanStudy:
    type: application
    platform: macOS
    sources:
      - path: ThubanStudy/App
      - path: ThubanStudy/Views
      - path: ThubanStudy/Web
      - path: ThubanStudy/Resources/Assets.xcassets
      - path: ThubanStudy/Resources/web
        type: folder
    dependencies:
      - package: ThubanCore
      - package: StudyGraph
    info:
      path: ThubanStudy/Resources/Info.plist
      properties:
        CFBundleName: Thuban Study
        CFBundleDisplayName: Thuban Study
        CFBundleIdentifier: com.thuban.study
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.education
        NSHumanReadableCopyright: "© 2026 Chancellor Verdery"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # The Thuban Graph checkout this build used (`git rev-parse --short HEAD`, "-dirty" when modified); the
        # scripts pass it, About › Acknowledgements shows it.
        ThubanGraphKitRevision: $(THUBAN_GRAPH_KIT_REVISION)
        # Opts in to the shared Thuban scheme: other Thuban apps may launch this one with `--refresh-icon`.
        ThubanSharedTheme: true
    entitlements:
      path: ThubanStudy/Resources/ThubanStudy.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thuban.study
        PRODUCT_NAME: Thuban Study
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: false
