<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Export equation sheet</title>

  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="thuban://bundle/vendor/mathlive/mathlive-static.css">
  <link rel="stylesheet" href="export.css">
  <style id="theme"></style>

  <!-- bridge.js is always first. Deferred scripts run in order, before DOMContentLoaded (when 'ready' is posted). -->
  <script src="../shared/bridge.js" defer></script>
  <script src="thuban://bundle/vendor/mathlive/mathlive.min.js" defer></script>
  <script src="exportlayout.js" defer></script>
  <script src="export.js" defer></script>
</head>
<body>
  <div id="app" class="eqp"></div>
  <!-- Filled only while printing: the pages at paper size, one per printed side. -->
  <div id="print-root" class="eqp-print-root"></div>
</body>
</html>
