<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Equations</title>

  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="thuban://bundle/vendor/mathlive/mathlive-static.css">
  <link rel="stylesheet" href="../shared/mathinput.css">
  <link rel="stylesheet" href="editor.css">
  <style id="theme"></style>

  <!-- bridge.js is always first; shared/mathinput.js gives the fields the answer form's shortcuts and keyboard. -->
  <script src="../shared/bridge.js" defer></script>
  <script src="thuban://bundle/vendor/mathlive/mathlive.min.js" defer></script>
  <script src="../shared/mathinput.js" defer></script>
  <script src="editor.js" defer></script>
</head>
<body>
  <main class="editor">
    <ol id="rows" class="rows" aria-label="Equations"></ol>
    <button id="add" class="btn btn-secondary btn-sm add" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Add equation</span>
    </button>
  </main>
</body>
</html>
