<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Question</title>

  <!-- Shared base styles, then MathLive's static-rendering stylesheet (KaTeX fonts resolve to vendor/mathlive/fonts/). -->
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="thuban://bundle/vendor/mathlive/mathlive-static.css" id="mathlive-static-css">
  <link rel="stylesheet" href="../shared/mathinput.css">
  <link rel="stylesheet" href="question.css">

  <!-- The native app fills this with the resolved theme (':root{--bg:…}') via the 'theme' bridge message. -->
  <style id="theme"></style>

  <!-- bridge.js is always first. Deferred scripts run in order, before DOMContentLoaded (when 'ready' is posted). -->
  <script src="../shared/bridge.js" defer></script>
  <script src="thuban://bundle/vendor/mathlive/mathlive.min.js" defer></script>
  <script src="thuban://bundle/vendor/marked/marked.min.js" defer></script>
  <script src="thuban://bundle/vendor/dompurify/purify.min.js" defer></script>
  <script src="../shared/mathinput.js" defer></script>
  <script src="diagram.js" defer></script>
  <script src="question.js" defer></script>
</head>
<body>
  <main id="form" class="form" aria-busy="true">
    <!-- The eyebrow line (question number, seed chip) is native; this page renders stem + parts only. -->
    <div id="stem" class="stem"></div>
    <div id="parts" class="parts"></div>
    <p id="empty" class="empty">Waiting for a question…</p>
  </main>
</body>
</html>
